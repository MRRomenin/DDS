{% extends "base.html" %}

{% block content %}

<div class="container my-4" style="max-width: 600px;">
    <h1 class="mb-3">Добавление транзакции</h1>

    <a href="{% url 'list' %}" class="btn btn-outline-secondary mb-4">Назад</a>


    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    {{ form.non_field_errors }}
    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            {{ field.label_tag }}
        </div>
        {{ field }}
        <div class="mb-3">
            {{ field.errors }}
        </div>
        {% endfor %}

        <button type="submit" id="button_send" class="btn btn-primary">Отправить</button>
    </form>
</div>

{% endblock %}
