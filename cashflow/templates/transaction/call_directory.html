<form method="POST" action="{% url 'delete_mass' url_key %}"
      onsubmit="return confirm('Удалить выбранные записи?');">
    {% csrf_token %}
    {% for item in items %}
    <div class="m-1">

        <label>
            <input type="checkbox" name="selected_items" value="{{ item.pk }}">
            {{ item }}
        </label>
    </div>
    {% empty %}
    <div class="text-muted">{{ empty_text }}</div>
    {% endfor %}
        <button type="submit" class="btn btn-danger mt-3"
            {% if not items %}
            disabled
            {% endif %}>
        Удалить выбранное
    </button>
</form>
