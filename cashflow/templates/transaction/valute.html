{% block content %}

<div class="container my-4">
    <h3 class="mb-3">Курсы валют ЦБ РФ</h3>
    <div class="row g-3">

        {% for item in rates.values %}
        <div class="col-12 col-md-4">
            <div class="card shadow-sm rounded-4 p-3 text-center custom-element">{{ item.name }}:
                {{ item.valute|floatformat:2 }}
                {{ item.symbol }}
            </div>
        </div>

        {% endfor %}
    </div>
</div>

{% endblock %}
